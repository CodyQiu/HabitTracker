{% extends "layout.html" %}
{% block title %}Timer{% endblock %}

{% block content %}
<div class="text-center">
  <h1 class="section-title">Timer for: {{ habit.habit }}</h1>
  <p class="timer-meta">Duration: {{ habit.duration }} minutes</p>
</div>

<div class="timer-panel text-center mt-4">
  <div id="timer" class="timer-display">{{ habit.duration }}:00</div>
  <div class="timer-actions">
    <button id="startBtn" class="btn app-btn app-btn-primary" onclick="startTimer(parseInt('{{ habit.duration }}'))">
      Start
    </button>
    <button id="pauseBtn" class="btn app-btn app-btn-soft-warning" onclick="pauseTimer()">Pause</button>
    <button
      id="resumeBtn"
      class="btn app-btn app-btn-secondary"
      onclick="resumeTimer()"
      style="display: none;"
    >
      Resume
    </button>
    <button id="endBtn" class="btn app-btn app-btn-soft-danger" onclick="endHabit()">End Habit</button>
  </div>
</div>

<script>
  let timer;
  let countdown;
  let startTime;

  function startTimer(duration) {
    timer = duration * 60;
    startTime = Date.now();
    const display = document.getElementById("timer");
    const startBtn = document.getElementById("startBtn");
    startBtn.disabled = true;

    let minutes;
    let seconds;
    countdown = setInterval(function () {
      minutes = parseInt(timer / 60, 10);
      seconds = parseInt(timer % 60, 10);

      minutes = minutes < 10 ? "0" + minutes : minutes;
      seconds = seconds < 10 ? "0" + seconds : seconds;
      display.textContent = minutes + ":" + seconds;

      if (--timer < 0) {
        clearInterval(countdown);
        display.textContent = "Time's up!";
        alert("Time's up! Great job on completing your habit!");
      }
    }, 1000);
  }

  function pauseTimer() {
    const pauseBtn = document.getElementById("pauseBtn");
    const resumeBtn = document.getElementById("resumeBtn");
    pauseBtn.style.display = "none";
    resumeBtn.style.display = "inline-block";
    resumeBtn.disabled = false;
    clearInterval(countdown);
  }

  function resumeTimer() {
    const display = document.getElementById("timer");
    const resumeBtn = document.getElementById("resumeBtn");
    const pauseBtn = document.getElementById("pauseBtn");
    resumeBtn.style.display = "none";
    pauseBtn.style.display = "inline-block";
    resumeBtn.disabled = true;

    let minutes;
    let seconds;
    countdown = setInterval(function () {
      timer--;
      minutes = parseInt(timer / 60, 10);
      seconds = parseInt(timer % 60, 10);

      minutes = minutes < 10 ? "0" + minutes : minutes;
      seconds = seconds < 10 ? "0" + seconds : seconds;
      display.textContent = minutes + ":" + seconds;

      if (timer < 0) {
        clearInterval(countdown);
        display.textContent = "Time's up!";
        alert("Time's up! Great job on completing your habit!");
      }
    }, 1000);
  }

  function endHabit() {
    const endBtn = document.getElementById("endBtn");
    endBtn.disabled = true;

    clearInterval(countdown);
    const elapsedSeconds = Math.floor((Date.now() - startTime) / 1000);

    fetch(`/complete/{{ habit.id }}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ duration: elapsedSeconds / 60 })
    })
      .then((response) => {
        if (!response.ok) throw new Error("Network response was not ok");
        return response.json();
      })
      .then((data) => {
        alert(data.message);
        window.location.href = "/";
      })
      .catch((err) => console.error("Error completing habit:", err));
  }
</script>
{% endblock %}
