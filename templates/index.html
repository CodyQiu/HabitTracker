{% extends "layout.html" %}
{% block title %}Home{% endblock %}

{% block content %}
<div class="text-center">
  <h1 class="section-title">Welcome to the Home Page</h1>

  {% if current_user.is_authenticated %}
  <p class="welcome-line">Hi {{ current_user.username }}! You are now logged in!</p>
  {% else %}
  <p class="welcome-line">You are not logged in.</p>
  {% endif %}

  <div class="hero-actions">
    <a class="btn app-btn app-btn-primary" href="/addHabits">Add a Habit</a>
    <a class="btn app-btn app-btn-secondary" href="/start">Start a Session</a>
  </div>
</div>
{% endblock %}
