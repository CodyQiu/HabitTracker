{% extends "layout.html" %}
{% block title %}Login{% endblock %}

{% block content %}
<div class="compact-panel page-panel p-0 bg-transparent border-0 shadow-none">
  <h1 class="section-title">Login</h1>

  <form class="form-shell" action="/login" method="POST">
    <div class="form-group mb-3">
      <label class="form-label" for="username">Username</label>
      <input class="form-control" id="username" type="text" name="username" autocomplete="off" autofocus required />
    </div>
    <div class="form-group mb-4">
      <label class="form-label" for="password">Password</label>
      <input class="form-control" id="password" type="password" name="password" autocomplete="off" required />
    </div>
    <button class="btn app-btn app-btn-primary btn-block" type="submit">Login</button>
  </form>
</div>
{% endblock %}
