{% extends "layout.html" %}
{% block title %}Add a Habit{% endblock %}

{% block content %}
<div class="compact-panel page-panel p-0 bg-transparent border-0 shadow-none">
  <h1 class="section-title">Add a Habit</h1>

  <form class="form-shell" action="/addHabits" method="POST">
    <div class="form-group mb-4">
      <label class="form-label" for="habit">Habit name</label>
      <input
        class="form-control"
        id="habit"
        type="text"
        name="habit"
        placeholder="Insert a habit or activity you want to keep track of"
        autofocus
        autocomplete="off"
        required
      />
    </div>

    <p class="form-label mb-2">Duration</p>
    <div class="duration-grid">
      <div class="duration-option">
        <input class="form-check-input" type="radio" id="duration30" value="30" name="duration" required />
        <label for="duration30">30 min</label>
      </div>
      <div class="duration-option">
        <input class="form-check-input" type="radio" id="duration60" value="60" name="duration" />
        <label for="duration60">60 min</label>
      </div>
      <div class="duration-option">
        <input class="form-check-input" type="radio" id="duration90" value="90" name="duration" />
        <label for="duration90">90 min</label>
      </div>
      <div class="duration-option">
        <input class="form-check-input" type="radio" id="duration120" value="120" name="duration" />
        <label for="duration120">120 min</label>
      </div>
    </div>

    <button class="btn app-btn app-btn-primary btn-block" type="submit">Save Habit</button>
  </form>
</div>
{% endblock %}
